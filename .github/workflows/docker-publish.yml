name: Build and Push Dataset Profiler API & Ray Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The release's tests: the images are only built and pushed when they pass.
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Log in to the Container registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large, non-essential packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost

          # Prune docker
          docker system prune -af

          echo "Disk space after cleanup:"
          df -h

      - name: Extract metadata (tags, labels) for Docker image for Ray Image
        id: meta_ray_image
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ env.REGISTRY }}/datagems-eosc/dg-dataset-profiler-ray
          tags: |
            type=ref,event=tag

      - name: Build and push Docker image for Ray
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile.ray
          push: true
          tags: ${{ steps.meta_ray_image.outputs.tags }}
          labels: ${{ steps.meta_ray_image.outputs.labels }}

      - name: Extract metadata (tags, labels) for Docker image for API Image
        id: meta_api_image
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ env.REGISTRY }}/datagems-eosc/dg-dataset-profiler-api
          tags: |
            type=ref,event=tag

      - name: Build and push Docker image for API
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ steps.meta_api_image.outputs.tags }}
          labels: ${{ steps.meta_api_image.outputs.labels }}

  # GitHub Release for the tag: the commits since the previous tag
  # (scripts/release_notes.sh) and the test report the images were gated on.
  release:
    needs: [tests, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download test report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-report
          path: test-results

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release_notes.sh "$TAG" > release-notes.md
          {
            echo
            echo "### Images"
            echo
            echo "- \`ghcr.io/datagems-eosc/dg-dataset-profiler-api:${TAG}\`"
            echo "- \`ghcr.io/datagems-eosc/dg-dataset-profiler-ray:${TAG}\`"
            echo
            echo "Tests: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (JUnit report attached)."
          } >> release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          cp test-results/junit.xml "test-report-${TAG}.xml"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release written by hand keeps its notes; only an empty one is filled.
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file release-notes.md
            fi
            gh release upload "$TAG" "test-report-${TAG}.xml" --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag \
              "test-report-${TAG}.xml"
          fi
