# DataGEMS vocabulary at https://datagems.eu/ns/
# Paste inside the existing datagems.eu server { } block (the HTTPS one), above the WordPress locations.
# Tested with nginx 1.18 (nginx -t, plus a request for each URL it serves).
# ^~ stops WordPress's regex locations (e.g. \.php$) and its try_files from taking these URLs.
location = /ns {
    return 301 https://datagems.eu/ns/;
}
location ^~ /ns/ {
    root /var/www/datagems-vocab;          # folder that contains ns/index.html, ns/datagems.ttl, ns/context.jsonld
    types {
        text/html            html;
        text/turtle          ttl;
        application/ld+json  jsonld;
    }
    charset utf-8;
    charset_types text/turtle application/ld+json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Vary "Accept" always;
    add_header Cache-Control "public, max-age=3600" always;

    # https://datagems.eu/ns/ : HTML for browsers, Turtle for RDF tools
    location = /ns/ {
        try_files $datagems_ns_index =404;
    }

    # Term IRIs such as https://datagems.eu/ns/recordPath point to their entry in the docs
    location ~ ^/ns/([A-Za-z][A-Za-z0-9]*)$ {
        return 303 https://datagems.eu/ns/#$1;
    }
}
